name: Android CI and APK releases

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# A tag push and a manually published release can refer to the same tag.
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    outputs:
      release_asset: ${{ steps.release_version.outputs.asset_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Validate release automation
        run: |
          bash .github/scripts/test-release-version.sh
          bash .github/scripts/test-publish-release.sh

      - name: Read version from release tag
        id: release_version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: bash .github/scripts/release-version.sh "$GITHUB_REF_NAME"

      # The checked-in native libraries are used instead of compiling Rust.
      - name: Run unit tests and build Debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug -x buildRustLibs

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TS6-Han-Android-App
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Exercise the release variant on PRs and branch builds without exposing
      # real signing keys or publishing this disposable test-signed APK.
      - name: Test signed release build with a throwaway key
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/coldts-ci-test.keystore
          ANDROID_KEYSTORE_PASSWORD: ci-test-password
          ANDROID_KEY_ALIAS: ci-test
          ANDROID_KEY_PASSWORD: ci-test-password
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keystore "$ANDROID_KEYSTORE_FILE" -storetype PKCS12 \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD \
            -alias "$ANDROID_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 1 \
            -dname 'CN=ColdTs CI Test'
          ./gradlew --no-daemon :app:assembleRelease -x buildRustLibs \
            -PcoldtsVersionName=9.2.3 -PcoldtsVersionCode=9002003
          bash .github/scripts/verify-release-apk.sh \
            app/build/outputs/apk/release/ColdTs-Client-v9.2.3.apk 9.2.3 9002003

      - name: Prepare release signing key
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z ${!name:-} ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if (( missing )); then
            echo 'Configure the Android signing secrets described in README.md before publishing a release.' >&2
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/coldts-release.keystore"
          [[ -s "$RUNNER_TEMP/coldts-release.keystore" ]]
          keytool -list -keystore "$RUNNER_TEMP/coldts-release.keystore" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build signed release APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/coldts-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.release_version.outputs.version_name }}
          VERSION_CODE: ${{ steps.release_version.outputs.version_code }}
          APK_NAME: ${{ steps.release_version.outputs.asset_name }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleRelease -x buildRustLibs \
            "-PcoldtsVersionName=$VERSION_NAME" "-PcoldtsVersionCode=$VERSION_CODE"
          bash .github/scripts/verify-release-apk.sh \
            "app/build/outputs/apk/release/$APK_NAME" "$VERSION_NAME" "$VERSION_CODE"

      - name: Upload signed release APK for publishing
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: ColdTs-release-apk
          path: app/build/outputs/apk/release/${{ steps.release_version.outputs.asset_name }}
          if-no-files-found: error

      - name: Remove temporary signing keys
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/coldts-release.keystore" "$RUNNER_TEMP/coldts-ci-test.keystore"

  publish:
    name: Publish signed APK to Releases
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release automation
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: ColdTs-release-apk
          path: release

      - name: Create release or attach APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ASSET: ${{ needs.build.outputs.release_asset }}
        run: bash .github/scripts/publish-release.sh "$GITHUB_REF_NAME" "release/$RELEASE_ASSET"
